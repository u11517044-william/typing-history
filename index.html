<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英打遊戲開發歷程</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    color: #111111;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px;
  }
  h1 {
    margin: 0 0 40px;
    font-size: 2.25rem;
    text-align: center;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    padding: 24px;
    color: #111111;
    background: #f4f4f4;
    border: 2px solid #111111;
    border-radius: 12px;
    font-size: 1.25rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  .card:hover {
    background: #e6e6e6;
  }
  .card:focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 3px;
  }
  @media (max-width: 720px) {
    .cards {
      grid-template-columns: 1fr;
    }
    h1 {
      font-size: 1.75rem;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>英打遊戲開發歷程</h1>
    <div class="cards">
      <a class="card" href="file:///E:/my-typing-work/typing-v1/index.html" target="_blank" rel="noopener">英打遊戲版本一</a>
      <a class="card" href="file:///E:/my-typing-work/typing-V2/index.html" target="_blank" rel="noopener">英打遊戲版本二</a>
      <a class="card" href="v3/index.html">英打遊戲版本三 (ASDF 練習)</a>
      <a class="card" href="v4/index.html">英打遊戲版本四 (十鍵掉落練習)</a>
      <a class="card" href="v5/index.html">英打遊戲版本五 (高塔 Boss 戰)</a>
    </div>
  </main>
</body>
</html>
