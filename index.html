<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橫向進擊高塔｜Boss 擊退英打戰</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --deep: #0b1220;
    --g: #10b981;
    --g2: #34d399;
    --txt: #a7f3d0;
    --dim: #64748b;
    --pending: #94a3b8;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #c084fc;
    --ground: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--txt);
    font-family: "Consolas", "Courier New", "Noto Sans TC", monospace;
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(16,185,129,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16,185,129,.05) 1px, transparent 1px);
    background-size: 32px 32px;
    user-select: none;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ===== 導覽 ===== */
  .nav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--g); box-shadow: 0 0 18px rgba(16,185,129,.25);
  }
  .nav a.back {
    color: var(--g2); text-decoration: none; font-weight: bold;
    border: 1px solid var(--g); padding: 6px 12px; border-radius: 6px; transition: .2s;
  }
  .nav a.back:hover { background: var(--g); color: #052e1f; box-shadow: 0 0 12px var(--g); }
  .nav h1 { font-size: 1.15rem; letter-spacing: 2px; color: var(--g2); text-shadow: 0 0 8px rgba(16,185,129,.7); }
  .nav h1 span { color: var(--dim); font-size: .85rem; letter-spacing: 1px; }
  .mini {
    background: transparent; color: var(--dim); border: 1px solid #334155;
    padding: 5px 10px; border-radius: 6px; font-size: .8rem; transition: .2s;
  }
  .mini:hover { color: var(--red); border-color: var(--red); }

  main { max-width: 1000px; margin: 0 auto; padding: 16px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid rgba(16,185,129,.45); border-radius: 12px;
    box-shadow: 0 0 16px rgba(16,185,129,.12), inset 0 0 20px rgba(0,0,0,.25);
  }

  /* ===== 頂端：樓層選擇與進度 ===== */
  .top { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .toprow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  #floorTitle { font-size: 1.2rem; font-weight: bold; color: var(--g2); text-shadow: 0 0 8px rgba(16,185,129,.6); }
  #saveState { font-size: .8rem; color: var(--dim); transition: .3s; }
  #saveState.flash { color: var(--g2); text-shadow: 0 0 8px var(--g); }
  #floorDesc { font-size: .85rem; }
  .tower { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .fl {
    background: var(--deep); color: var(--g2); border: 1px solid var(--g); border-radius: 8px;
    padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px;
    font-weight: bold; font-size: .9rem; transition: .15s;
  }
  .fl small { font-size: .62rem; font-weight: normal; opacity: .85; }
  .fl .ic { font-size: 1.15rem; }
  .fl:hover:not(:disabled) { background: rgba(16,185,129,.2); box-shadow: 0 0 10px var(--g); }
  .fl.current { background: var(--g); color: #052e1f; box-shadow: 0 0 14px var(--g); }
  .fl.cleared:not(.current) { border-style: double; border-width: 3px; }
  .fl:disabled { color: #475569; border-color: #334155; background: #0a0f1c; cursor: not-allowed; }
  .prog { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--dim); }
  .prog .track { flex: 1; height: 8px; background: #020617; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
  .prog .track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #059669, var(--g2)); box-shadow: 0 0 8px var(--g); transition: width .3s; }

  /* ===== 戰鬥區 ===== */
  #app { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #app.shake { animation: shake .3s; }
  #app.shake-big { animation: shake .45s; }

  .stage {
    position: relative; overflow: hidden; height: 330px;
    border: 1px solid #334155; border-radius: 10px;
    background:
      radial-gradient(ellipse at 20% 40%, rgba(168,85,247,.18), transparent 55%),
      radial-gradient(ellipse at 85% 40%, rgba(16,185,129,.18), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 60px),
      linear-gradient(#0b1220, #111c33 70%, #16233f);
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--ground); z-index: 1;
    background: repeating-linear-gradient(90deg, #1e293b 0 38px, #0f172a 38px 40px);
    border-top: 2px solid var(--g); box-shadow: 0 -4px 14px rgba(16,185,129,.35);
  }
  #warn { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 100% 60%, rgba(239,68,68,.55), rgba(239,68,68,.12) 60%, transparent); }
  #warn.on { animation: warnblink .5s infinite alternate; }
  #warnText {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 9; pointer-events: none;
    font-size: 1.2rem; font-weight: 900; letter-spacing: 3px; color: #fecaca; text-shadow: 0 0 12px var(--red);
    opacity: 0;
  }
  #warnText.on { opacity: 1; animation: blink .5s infinite; }
  .stage .zonelabel { position: absolute; top: 8px; font-size: .68rem; color: var(--dim); letter-spacing: 1px; z-index: 2; }
  .stage .zl-l { left: 12px; } .stage .zl-r { right: 12px; }

  /* 出生點 */
  .gate {
    position: absolute; left: 4px; bottom: var(--ground); width: 44px; height: 120px; z-index: 2;
    border-radius: 50% / 40%; border: 3px solid var(--purple);
    background: radial-gradient(ellipse, rgba(192,132,252,.5), rgba(88,28,135,.2) 60%, transparent);
    box-shadow: 0 0 22px var(--purple), inset 0 0 18px rgba(192,132,252,.6);
    animation: gatepulse 2s infinite;
  }

  /* Boss */
  .boss {
    --bc: #a78bfa;
    position: absolute; bottom: var(--ground); left: 44px; z-index: 4;
    width: clamp(120px, 22vw, 170px); display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .bname { font-size: .72rem; color: #fca5a5; letter-spacing: 1px; white-space: nowrap; }
  .bhp {
    position: relative; width: 100%; height: 14px; border-radius: 8px; overflow: hidden;
    background: #020617; border: 1px solid var(--red); box-shadow: 0 0 10px rgba(239,68,68,.45);
  }
  .bhp .trail, .bhp .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
  .bhp .trail { background: #fca5a5; transition: width .7s .25s; }
  .bhp .fill {
    background:
      repeating-linear-gradient(90deg, transparent 0 14px, rgba(0,0,0,.35) 14px 16px),
      linear-gradient(90deg, #b91c1c, #f43f5e, #fb7185);
    box-shadow: 0 0 8px #f43f5e; transition: width .15s;
  }
  .bhp span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .62rem; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; z-index: 2; }
  .bicon-wrap { display: inline-block; }
  .bicon {
    font-size: clamp(3.6rem, 12vw, 6rem); line-height: 1.05; display: inline-block;
    filter: drop-shadow(0 0 14px var(--bc)); animation: walk .7s ease-in-out infinite;
  }
  .boss.hit .bicon-wrap { animation: hit .22s; }
  .boss.dead .bicon-wrap { animation: die .9s forwards; }
  .boss.enter .bicon-wrap { animation: enter .6s; }

  /* 玩家陣地 */
  .home { position: absolute; right: 8px; bottom: var(--ground); width: 150px; height: 190px; z-index: 3; }
  .chp { position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #020617; border: 1px solid var(--g); border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(16,185,129,.4); }
  .chp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #059669, #34d399); transition: width .2s; }
  .chp i.low { background: linear-gradient(90deg, #b91c1c, #f87171); }
  .chp span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; z-index: 2; }
  .player { position: absolute; left: 0; bottom: 0; width: 64px; text-align: center; }
  .player .sprite { font-size: 3.2rem; display: inline-block; filter: drop-shadow(0 0 8px rgba(16,185,129,.7)); }
  .player .wand { position: absolute; left: -10px; top: 10px; font-size: 1.5rem; transform: rotate(30deg) scaleX(-1); }
  .player.hurt .sprite { animation: hurt .35s; }
  .player.dead .sprite { filter: grayscale(1); transform: rotate(-90deg); transition: .5s; }
  .crystal {
    position: absolute; right: 8px; bottom: 0; width: 64px; height: 110px;
    background: linear-gradient(135deg, #a7f3d0, #10b981 45%, #065f46);
    clip-path: polygon(50% 0, 100% 35%, 80% 100%, 20% 100%, 0 35%);
    filter: drop-shadow(0 0 14px #10b981); animation: crystalfloat 2.4s ease-in-out infinite;
  }
  .crystal.danger { background: linear-gradient(135deg, #fecaca, #ef4444 45%, #7f1d1d); filter: drop-shadow(0 0 18px #ef4444); animation: blink .3s infinite; }
  .crystal.dead { background: #334155; filter: none; animation: none; }

  /* 特效 */
  .missile {
    position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; z-index: 6; pointer-events: none;
    background: radial-gradient(#ecfdf5, #10b981 70%);
    box-shadow: 0 0 14px #10b981, 0 0 30px #10b981, 22px 0 18px rgba(16,185,129,.55);
    transition: left .22s linear, top .22s linear;
  }
  .missile.big { width: 30px; height: 30px; margin: -15px 0 0 -15px; background: radial-gradient(#fffbeb, #f59e0b 70%); box-shadow: 0 0 22px #f59e0b, 0 0 44px #f59e0b, 34px 0 24px rgba(245,158,11,.6); }
  .dmg {
    position: absolute; z-index: 7; pointer-events: none; font-weight: 900; font-size: 1.2rem; white-space: nowrap;
    color: var(--g2); text-shadow: 0 0 8px var(--g), 0 2px 2px #000; animation: floatUp .9s forwards;
  }
  .dmg.crit { font-size: 2rem; color: #fbbf24; text-shadow: 0 0 12px var(--amber), 0 2px 2px #000; }
  .dmg.pl { color: #f87171; text-shadow: 0 0 8px var(--red), 0 2px 2px #000; font-size: 1.6rem; }
  .dmg.kb { font-size: 1.1rem; color: #67e8f9; text-shadow: 0 0 8px #06b6d4, 0 2px 2px #000; }
  .ring {
    position: absolute; z-index: 5; pointer-events: none; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 4px solid #fbbf24; box-shadow: 0 0 16px #f59e0b; animation: ring .5s forwards;
  }

  .log { min-height: 1.4em; text-align: center; font-size: .88rem; }

  /* ===== 打字目標 ===== */
  .target {
    text-align: center; padding: 10px 14px; min-height: 84px;
    background: #020617; border: 2px solid var(--g); border-radius: 12px; line-height: 1.5;
    box-shadow: 0 0 16px rgba(16,185,129,.45), inset 0 0 12px rgba(16,185,129,.12);
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .target.t-char { font-size: 3.4rem; }
  .target.t-word { font-size: clamp(1.8rem, 6vw, 2.6rem); }
  .target.t-sentence { font-size: clamp(1.05rem, 3vw, 1.5rem); line-height: 1.8; }
  .target.flash { animation: okflash .3s; }
  .wordgrp { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; min-width: .6em; text-align: center; color: var(--pending); border-bottom: 3px solid transparent; }
  .ch.space { font-size: .7em; color: #475569; min-width: .8em; }
  .ch.done { color: var(--g); text-shadow: 0 0 8px rgba(16,185,129,.9); }
  .ch.current { color: #fff; background: rgba(16,185,129,.2); border-bottom-color: var(--g2); animation: blink 1s infinite; }
  .ch.current.error { color: #fecaca; background: rgba(239,68,68,.3); border-bottom-color: var(--red); animation: none; }
  #shiftHint { min-height: 1.2em; text-align: center; font-size: .82rem; color: var(--amber); }

  /* ===== 統計 ===== */
  .hud { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .meter { background: var(--deep); border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; }
  .meter .lab { display: flex; justify-content: space-between; font-size: .75rem; color: var(--dim); margin-bottom: 4px; }
  .meter .lab b { color: var(--g2); }
  .meter .tr { height: 12px; background: #020617; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
  .meter .tr i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #059669, #fbbf24, #ef4444); }
  .statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stat { background: var(--deep); border: 1px solid #334155; border-radius: 8px; padding: 7px 2px; }
  .stat .k { font-size: .68rem; color: var(--dim); letter-spacing: 1px; }
  .stat .v { font-size: 1.15rem; color: var(--g2); font-weight: bold; }
  .stat .v.low { color: var(--amber); }

  /* ===== 鍵盤 ===== */
  #keyboard { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 5px; padding: 10px; background: var(--deep); border: 1px solid #334155; border-radius: 10px; }
  .krow { display: flex; gap: 5px; }
  .key, .spacer { flex: var(--f, 1) 1 0; min-width: 0; }
  .key {
    position: relative; height: clamp(30px, 4.8vw, 46px); display: flex; align-items: center; justify-content: center;
    background: #111c33; color: var(--pending); border: 1px solid #334155; border-radius: 6px;
    font-size: clamp(.55rem, 1.5vw, .9rem); transition: background .08s, box-shadow .08s;
  }
  .key.home::after { content: ""; position: absolute; bottom: 4px; width: 35%; height: 2px; background: #475569; border-radius: 2px; }
  .key.target {
    background: var(--g); color: #052e1f; font-weight: bold; border-color: #6ee7b7;
    box-shadow: 0 0 12px var(--g), 0 0 28px rgba(16,185,129,.6); animation: pulse 1s infinite;
  }
  .key.ok { background: var(--g2); color: #000; }
  .key.bad { background: var(--red); color: #fff; border-color: #fca5a5; box-shadow: 0 0 14px var(--red); animation: none; }
  .note { text-align: center; font-size: .74rem; color: var(--dim); }

  /* ===== 準備畫面 / 彈窗 ===== */
  .ready {
    position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 16px; background: rgba(2,6,23,.88);
  }
  .ready[hidden] { display: none; }
  .ready h2 { color: var(--g2); font-size: 1.5rem; text-shadow: 0 0 10px var(--g); }
  .ready p { font-size: .88rem; }
  .ready .hint { color: var(--dim); font-size: .78rem; }
  .modal { position: fixed; inset: 0; background: rgba(2,6,23,.82); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal[hidden] { display: none; }
  .box { width: 100%; max-width: 430px; text-align: center; padding: 26px 22px; background: var(--panel); border: 2px solid var(--g); border-radius: 14px; box-shadow: 0 0 30px rgba(16,185,129,.5); animation: pop .3s; }
  .box.fail { border-color: var(--red); box-shadow: 0 0 30px rgba(239,68,68,.45); }
  .box h2 { font-size: 1.5rem; margin-bottom: 6px; color: var(--g2); }
  .box.fail h2 { color: var(--red); }
  .box p { font-size: .9rem; margin-bottom: 14px; }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .res div { background: var(--deep); border: 1px solid #334155; border-radius: 8px; padding: 8px; }
  .res b { display: block; font-size: 1.2rem; color: var(--g2); }
  .res span { font-size: .72rem; color: var(--dim); }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 9px 18px; border-radius: 8px; font-size: .95rem; font-weight: bold; background: transparent; color: var(--g2); border: 1px solid var(--g); transition: .15s; }
  .btn:hover { background: rgba(16,185,129,.2); }
  .btn.primary { background: var(--g); color: #052e1f; box-shadow: 0 0 12px var(--g); }
  .btn.primary:hover { background: var(--g2); }

  /* ===== 動畫 ===== */
  @keyframes blink { 50% { opacity: .55; } }
  @keyframes pulse { 50% { box-shadow: 0 0 6px var(--g), 0 0 14px rgba(16,185,129,.4); } }
  @keyframes pop { 0% { transform: scale(1.4); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, -2px); } 80% { transform: translate(3px, 2px); } }
  @keyframes walk { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  @keyframes enter { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes hit { 0% { filter: brightness(1); } 40% { filter: brightness(2.4) drop-shadow(0 0 20px #10b981); } 100% { filter: brightness(1); } }
  @keyframes die { 0% { transform: none; opacity: 1; } 60% { transform: scale(1.25) rotate(10deg); filter: brightness(3); opacity: 1; } 100% { transform: scale(0) rotate(180deg); opacity: 0; } }
  @keyframes hurt { 0% { transform: none; } 30% { transform: translateX(10px) rotate(12deg); filter: drop-shadow(0 0 14px #ef4444); } 100% { transform: none; } }
  @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -64px) scale(1); opacity: 0; } }
  @keyframes warnblink { from { opacity: .25; } to { opacity: 1; } }
  @keyframes gatepulse { 50% { box-shadow: 0 0 34px var(--purple), inset 0 0 26px rgba(192,132,252,.8); } }
  @keyframes crystalfloat { 50% { transform: translateY(-6px); } }
  @keyframes ring { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
  @keyframes okflash { 0% { box-shadow: 0 0 26px var(--g2); } 100% { box-shadow: 0 0 16px rgba(16,185,129,.45); } }

  .navbtns { display: flex; gap: 8px; align-items: center; }
  .mini.sound { color: var(--g2); border-color: var(--g); }
  .mini.sound:hover { background: rgba(16,185,129,.18); color: var(--g2); border-color: var(--g); }
  .mini.sound.off { color: var(--dim); border-color: #334155; }

  .mini.achbtn { color: #fbbf24; border-color: #b45309; }
  .mini.achbtn:hover { background: rgba(251,191,36,.12); color: #fde68a; border-color: #fbbf24; }

  /* ===== 成就牆 ===== */
  .achbox { max-width: 760px; max-height: 88vh; overflow-y: auto; }
  .achhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .achhead h2 { margin: 0; }
  .achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .badge {
    background: var(--deep); border: 1px solid #334155; border-radius: 10px; padding: 12px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  }
  .badge .bi { position: relative; font-size: 2.4rem; line-height: 1.2; filter: grayscale(1); opacity: .35; }
  .badge .bi .lock { position: absolute; right: -10px; bottom: -4px; font-size: 1rem; filter: none; opacity: 1; }
  .badge .bn { font-weight: bold; color: var(--dim); }
  .badge .bd { font-size: .74rem; color: var(--dim); min-height: 2.4em; }
  .badge .bs { font-size: .7rem; color: var(--dim); }
  .badge.got { border-color: #fbbf24; background: linear-gradient(160deg, rgba(251,191,36,.10), rgba(16,185,129,.10)); box-shadow: 0 0 16px rgba(251,191,36,.45), inset 0 0 14px rgba(16,185,129,.14); }
  .badge.got .bi { filter: drop-shadow(0 0 10px #fbbf24); opacity: 1; animation: glow 2s ease-in-out infinite; }
  .badge.got .bn { color: #fbbf24; text-shadow: 0 0 8px rgba(251,191,36,.6); }
  .badge.got .bd { color: var(--txt); }
  .badge.got .bs { color: var(--g2); }

  .mini.weakbtn { color: #67e8f9; border-color: #0e7490; }
  .mini.weakbtn:hover { background: rgba(103,232,249,.10); color: #cffafe; border-color: #67e8f9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 錯字分析 ===== */
  .weakbox { max-width: 620px; max-height: 88vh; overflow-y: auto; }
  .weaksum { font-size: .82rem; color: var(--dim); margin-bottom: 12px; }
  .weakempty { padding: 26px 8px; color: var(--dim); font-size: .9rem; }
  .weaknote { font-size: .74rem; color: var(--dim); margin: 12px 0 0; }
  .wk { background: var(--deep); border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; text-align: left; }
  .wk-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .wk-rank { color: var(--dim); font-size: 1rem; }
  .wk-key { font-size: 1.7rem; font-weight: 900; color: #fca5a5; text-shadow: 0 0 10px rgba(239,68,68,.55); min-width: 1.2em; }
  .wk-cnt { font-size: 1.05rem; color: #fbbf24; font-weight: bold; }
  .wk-rate { margin-left: auto; font-size: .75rem; color: var(--dim); }
  .wk-bar { height: 10px; background: #020617; border: 1px solid #334155; border-radius: 6px; overflow: hidden; margin: 6px 0; }
  .wk-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); box-shadow: 0 0 8px rgba(239,68,68,.6); }
  .wk-tip { font-size: .78rem; color: var(--txt); }
  .res div.worst { grid-column: 1 / -1; border-color: #b45309; background: rgba(245,158,11,.08); }
  .res div.worst b { color: #fbbf24; }
  .res div.worst.ok { border-color: #047857; background: rgba(16,185,129,.08); }
  .res div.worst.ok b { color: var(--g2); }
  .res div.worst .wtip { display: block; margin-top: 4px; color: var(--txt); }

  /* ===== 成就解鎖通知（右上角）===== */
  #toasts { position: fixed; top: 64px; right: 14px; z-index: 80; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    position: relative; overflow: hidden; min-width: 250px; max-width: 330px;
    display: flex; gap: 10px; align-items: center; padding: 10px 14px;
    background: linear-gradient(135deg, #1e293b, #0b1220); border: 2px solid #fbbf24; border-radius: 12px;
    box-shadow: 0 0 22px rgba(251,191,36,.6), 0 0 40px rgba(16,185,129,.35);
    animation: toastIn .45s cubic-bezier(.2,1.2,.4,1), toastOut .4s 4.2s forwards;
  }
  .toast::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.25), transparent); animation: shine 1.1s .35s; }
  .toast .ti { font-size: 2rem; filter: drop-shadow(0 0 8px #fbbf24); }
  .toast .tt { font-weight: 900; color: #fbbf24; font-size: .9rem; text-shadow: 0 0 8px rgba(251,191,36,.6); }
  .toast .td { font-size: .74rem; color: var(--txt); margin-top: 2px; }
  @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }
  @keyframes shine { to { left: 130%; } }
  @keyframes glow { 50% { filter: drop-shadow(0 0 18px #fde68a); } }

  @media (max-width: 640px) {
    #toasts { left: 14px; right: 14px; top: 56px; }
    .toast { max-width: none; }
    .tower { grid-template-columns: repeat(5, 1fr); }
    .nav h1 span { display: none; }
    .statrow { grid-template-columns: repeat(2, 1fr); }
    .stage { height: 290px; }
    .home { width: 118px; }
    .player { width: 48px; } .player .sprite { font-size: 2.4rem; }
    .crystal { width: 50px; height: 88px; }
    .gate { height: 90px; width: 34px; }
  }
</style>
</head>

<div id="modal" class="modal" hidden><div class="box" id="modalBox"></div></div>

  </div>

<!-- 成就解鎖通知 -->
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= 音效（BGM + 音效）================= */
  var MUTE_KEY = 'sideTowerTyping_muted';
  var muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}

  function makeAudio(src, vol, loop) {
    var a = new Audio(src);
    a.preload = 'auto';
    a.volume = vol;
    a.loop = !!loop;
    a.addEventListener('error', function () { /* 檔案不存在時靜默略過，不影響遊戲 */ });
    return a;
  }
  var bgm = makeAudio('audio/bgm.mp3', 0.35, true);          // 背景音樂（循環）
  var sfx = {
    hit:      makeAudio('audio/hit.wav', 0.5),               // 擊中 / 擊退
    critical: makeAudio('audio/critical.wav', 0.8),          // 完成單字爆擊
    warning:  makeAudio('audio/warning.wav', 0.7),           // Boss 碰撞扣血
    achievement: makeAudio('audio/achievement.wav', 0.8)     // 成就解鎖（選用）
  };
  var achFileMissing = false;                                // 沒有 achievement.wav 時改用內建提示音
  sfx.achievement.addEventListener('error', function () { achFileMissing = true; });

  function safePlay(a) {
    try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function playSfx(name) {
    if (muted) return;
    var a = sfx[name];
    if (!a) return;
    try { a.currentTime = 0; } catch (e) {}                  // 每次從頭播放，連續打字不卡頓
    safePlay(a);
  }
  function startBgm() {
    if (!muted && bgm.paused) safePlay(bgm);
  }
  function updateMuteBtn() {
    var b = document.getElementById('muteBtn');
    b.textContent = muted ? '🔇 靜音' : '🔊 音效開啟';
    b.classList.toggle('off', muted);
    b.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    if (muted) {
      bgm.pause();
      Object.keys(sfx).forEach(function (k) { sfx[k].pause(); });
    } else {
      safePlay(bgm);
    }
    updateMuteBtn();
    document.getElementById('muteBtn').blur();               // 避免之後按空白鍵誤觸按鈕
  }
  // 瀏覽器要求使用者互動後才能播放：第一次按鍵或點擊時啟動 BGM
  function firstGesture() {
    startBgm();
    document.removeEventListener('keydown', firstGesture);
    document.removeEventListener('pointerdown', firstGesture);
  }
  document.addEventListener('keydown', firstGesture);
  document.addEventListener('pointerdown', firstGesture);
  document.getElementById('muteBtn').addEventListener('click', toggleMute);
  updateMuteBtn();

  /* ================= 成就徽章系統 ================= */
  var ACH_KEY = 'sideTowerTyping_achievements_v1';
  var CRIT_GOAL = 20;          // 爆擊大師：累計單字爆擊次數
  var COMBO_GOAL = 30;         // 疾速連擊：連續打對字母數
  var WPM_GOAL = 60;           // 疾速連擊：或單場 WPM
  var WPM_MIN_CHARS = 50;      // 計算 WPM 至少要打對這麼多字，避免幾個字就爆衝的短戰鬥灌水
  var LOW_HP = 20;             // 極限生存：水晶血量 ≤ 此值仍獲勝（每次扣 20，血量只會是 20 的倍數）

  var ACHIEVEMENTS = [
    { id: 'first',     icon: '🥉', name: '初出茅廬',   desc: '突破第 1 層高塔 Boss' },
    { id: 'explorer',  icon: '🥈', name: '高塔探險家', desc: '突破第 5 層高塔 Boss' },
    { id: 'conqueror', icon: '👑', name: '高塔征服者', desc: '通關第 10 層終極魔王' },
    { id: 'speed',     icon: '⚡', name: '疾速連擊',   desc: '連續打對 30 個字母未失誤，或單場達 60 WPM（至少打對 50 字）' },
    { id: 'perfect',   icon: '🎯', name: '百發百中',   desc: '單場正確率 100% 並擊敗 Boss' },
    { id: 'crit',      icon: '💥', name: '爆擊大師',   desc: '累計發動 20 次單字爆擊大招' },
    { id: 'survivor',  icon: '🛡️', name: '極限生存',   desc: '水晶血量剩 20 HP 以下，仍成功擊敗 Boss' },
    { id: 'legend',    icon: '🏆', name: '鍵盤傳奇',   desc: '解鎖以上所有成就' }
  ];

  var ach = loadAch();
  var achOpen = false;

  function loadAch() {
    try {
      var d = JSON.parse(localStorage.getItem(ACH_KEY));
      if (d && typeof d === 'object') {
        return {
          unlocked: (d.unlocked && typeof d.unlocked === 'object') ? d.unlocked : {},
          crits: Number(d.crits) || 0
        };
      }
    } catch (e) {}
    return { unlocked: {}, crits: 0 };
  }
  function saveAch() {
    try { localStorage.setItem(ACH_KEY, JSON.stringify(ach)); } catch (e) {}
  }
  function achById(id) {
    for (var i = 0; i < ACHIEVEMENTS.length; i++) if (ACHIEVEMENTS[i].id === id) return ACHIEVEMENTS[i];
    return null;
  }
  function achCount() {
    return ACHIEVEMENTS.filter(function (a) { return !!ach.unlocked[a.id]; }).length;
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // 沒有 audio/achievement.wav 時，用 Web Audio 合成一段短短的上行提示音
  var chimeCtx = null;
  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!chimeCtx) chimeCtx = new Ctx();
      if (chimeCtx.state === 'suspended') chimeCtx.resume();
      [659.25, 830.61, 987.77, 1318.51].forEach(function (f, i) {
        var o = chimeCtx.createOscillator(), g = chimeCtx.createGain();
        var t = chimeCtx.currentTime + i * 0.09;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g); g.connect(chimeCtx.destination);
        o.start(t); o.stop(t + 0.4);
      });
    } catch (e) {}
  }
  function playAchSound() {
    if (muted) return;
    if (achFileMissing) chime(); else playSfx('achievement');
  }

  function showToast(a) {
    var box = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<div class="ti">' + a.icon + '</div><div><div class="tt">🏆 解鎖成就：' + a.name + '</div><div class="td">' + a.desc + '</div></div>';
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, 4700);
  }

  function unlockAch(id) {
    if (ach.unlocked[id]) return;
    var a = achById(id);
    if (!a) return;
    ach.unlocked[id] = Date.now();
    saveAch();
    showToast(a);
    playAchSound();
    renderAchBtn();
    if (achOpen) renderAch();
    if (id !== 'legend') {                                   // 其餘 7 個全解鎖 → 鍵盤傳奇
      var all = ACHIEVEMENTS.every(function (x) { return x.id === 'legend' || ach.unlocked[x.id]; });
      if (all) unlockAch('legend');
    }
  }

  function addCrit() {
    ach.crits++;
    saveAch();
    if (ach.crits >= CRIT_GOAL) unlockAch('crit');
  }

  // 擊敗 Boss 時結算的成就（在 win() 呼叫）
  function checkWinAchievements() {
    if (G.floor === 1)  unlockAch('first');
    if (G.floor === 5)  unlockAch('explorer');
    if (G.floor === 10) unlockAch('conqueror');
    if (G.wrong === 0)  unlockAch('perfect');
    if (G.hp <= LOW_HP) unlockAch('survivor');
    var wpm = (G.correct / 5) / (Math.max(G.elapsed, 1) / 60);
    if (G.correct >= WPM_MIN_CHARS && wpm >= WPM_GOAL) unlockAch('speed');
  }

  function renderAchBtn() {
    document.getElementById('achBtn').textContent = '🏆 成就牆 ' + achCount() + '/' + ACHIEVEMENTS.length;
  }
  function renderAch() {
    document.getElementById('achSummary').textContent = '已解鎖 ' + achCount() + ' / ' + ACHIEVEMENTS.length + ' 個徽章';
    var grid = document.getElementById('achGrid');
    grid.innerHTML = '';
    ACHIEVEMENTS.forEach(function (a) {
      var ts = ach.unlocked[a.id];
      var status;
      if (ts) status = '✔ 解鎖於 ' + fmtDate(ts);
      else if (a.id === 'crit') status = '🔒 未解鎖｜進度 ' + Math.min(ach.crits, CRIT_GOAL) + ' / ' + CRIT_GOAL;
      else status = '🔒 未解鎖';
      var d = document.createElement('div');
      d.className = 'badge' + (ts ? ' got' : '');
      d.innerHTML = '<div class="bi">' + a.icon + (ts ? '' : '<span class="lock">🔒</span>') + '</div>' +
        '<div class="bn">' + a.name + '</div><div class="bd">' + a.desc + '</div><div class="bs">' + status + '</div>';
      grid.appendChild(d);
    });
  }
  function openAch() {
    achOpen = true;                                          // 開啟期間遊戲暫停、不接收打字
    renderAch();
    document.getElementById('achModal').hidden = false;
    document.getElementById('achBtn').blur();
  }
  function closeAch() {
    achOpen = false;
    document.getElementById('achModal').hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function resetAch() {
    ach = { unlocked: {}, crits: 0 };
    saveAch();
    renderAchBtn();
    if (achOpen) renderAch();
  }
  document.getElementById('achBtn').addEventListener('click', openAch);
  document.getElementById('achClose').addEventListener('click', closeAch);
  document.getElementById('achModal').addEventListener('click', function (e) { if (e.target === this) closeAch(); });
  renderAchBtn();

  /* ================= 高頻錯字紀錄與弱點特訓 ================= */
  var WEAK_KEY = 'sideTowerTyping_wrongkeys_v1';
  var weak = loadWeak();           // { keys: { z: { wrong: 8, total: 20 } } }  total = 對該目標字元的總按鍵次數
  var weakOpen = false;
  var TRAIN = null;                // 目前的特訓關卡（非特訓時為 null）

  // 指法提醒：[手, 手指, 補充說明]
  var FINGERS = {
    q: ['左', '小指', '從 A 向上伸'],   w: ['左', '無名指', '從 S 向上伸'], e: ['左', '中指', '從 D 向上伸'],
    r: ['左', '食指', '從 F 向上伸'],   t: ['左', '食指', '從 F 向右上斜伸'],
    a: ['左', '小指', '基準位置'],       s: ['左', '無名指', '基準位置'],   d: ['左', '中指', '基準位置'],
    f: ['左', '食指', '基準位置，指尖有凸點'], g: ['左', '食指', '從 F 向右橫移一格'],
    z: ['左', '小指', '從 A 向下伸'],    x: ['左', '無名指', '從 S 向下伸'], c: ['左', '中指', '從 D 向下伸'],
    v: ['左', '食指', '從 F 向下伸'],    b: ['左', '食指', '從 F 向右下斜伸'],
    y: ['右', '食指', '從 J 向左上斜伸'], u: ['右', '食指', '從 J 向上伸'],  i: ['右', '中指', '從 K 向上伸'],
    o: ['右', '無名指', '從 L 向上伸'],  p: ['右', '小指', '從 ; 向上伸'],
    h: ['右', '食指', '從 J 向左橫移一格'], j: ['右', '食指', '基準位置，指尖有凸點'],
    k: ['右', '中指', '基準位置'],       l: ['右', '無名指', '基準位置'],   ';': ['右', '小指', '基準位置'],
    n: ['右', '食指', '從 J 向左下斜伸'], m: ['右', '食指', '從 J 向下伸'],
    ',': ['右', '中指', '從 K 向下伸'],  '.': ['右', '無名指', '從 L 向下伸'], '/': ['右', '小指', '從 ; 向下伸'],
    "'": ['右', '小指', '從 ; 向右伸'],
    ' ': 'Space 鍵建議使用大拇指按壓（左右手皆可）',
    '!': '! 需右手小指按住 Shift，再用左手小指按 1',
    '?': '? 需左手小指按住 Shift，再用右手小指按 /'
  };

  // 標點 / 空白的特訓短詞
  var PUNCT_WORDS = {
    '.': ['stop.', 'go on.', 'the end.', 'i see.'],
    ',': ['yes, sir', 'hi, tom', 'well, ok'],
    "'": ["it's", "don't", "i'm", "can't"],
    '!': ['go!', 'wow!', 'nice!', 'run!'],
    '?': ['why?', 'what?', 'how so?', 'who?'],
    ' ': ['go on', 'it is', 'a big dog', 'so far', 'my tea', 'up to me']
  };

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function curFloor() { return G.training ? TRAIN : FLOORS[G.floor - 1]; }

  function loadWeak() {
    try {
      var d = JSON.parse(localStorage.getItem(WEAK_KEY));
      if (d && d.keys && typeof d.keys === 'object') {
        var clean = {};
        Object.keys(d.keys).forEach(function (k) {

      return { k: k, wrong: v.wrong, total: v.total, rate: v.total ? v.wrong / v.total : 0 };
    }).filter(function (x) { return x.wrong > 0; })
      .sort(function (a, b) { return b.wrong - a.wrong || b.rate - a.rate || (a.k < b.k ? -1 : 1); })

  function allWords() {
    var seen = {}, out = [];
    FLOORS.forEach(function (F) {

    });
    return out;
  }
  function makeDrill(letters) {
    var helpers = ['f', 'j', 'd', 'k'], s = '';
    for (var j = 0; j < 4; j++) {
      var src = (j % 2 === 0 || Math.random() < 0.5) ? letters : (letters.length > 2 ? letters : helpers);
      var c, tries = 0;
      do { c = src[Math.floor(Math.random() * src.length)]; }
      while (c === s.charAt(s.length - 1) && src.length > 1 && ++tries < 6);
      s += c;
    }
    return s;
  }
  function buildTraining() {
    var top = topWeak(5);
    if (!top.length) return null;
    var keys = top.map(function (x) { return x.k; });
    var letters = keys.filter(function (k) { return /^[a-z;]$/.test(k); });
    var pool = [];

    // 1) 含弱點字母的真實單字：弱點字母密度高者優先
    var scored = allWords().map(function (w) {
      var lw = w.toLowerCase(), s = 0;
      for (var i = 0; i < lw.length; i++) if (keys.indexOf(lw.charAt(i)) !== -1) s++;
      return { w: w, s: s, d: s / lw.length };
    }).filter(function (x) { return x.s > 0; });
    shuffle(scored);
    scored.sort(function (a, b) { return b.d - a.d || b.s - a.s; });
    scored.slice(0, 10).forEach(function (x) { pool.push(x.w); });

    // 2) 標點 / 空白：短詞
    keys.forEach(function (k) {
      if (PUNCT_WORDS[k]) shuffle(PUNCT_WORDS[k].slice()).slice(0, 3).forEach(function (w) { pool.push(w); });
    });

    // 3) 連打練習：弱點字母組成的 4 字組合
    if (letters.length) {
      for (var t = 0, got = 0; t < 30 && got < 8; t++) {
        var d = makeDrill(letters);
        if (pool.indexOf(d) === -1) { pool.push(d); got++; }
      }
    }
    if (!pool.length) pool.push(keys.map(function (k) { return k + k; }).join('').slice(0, 6));

    var label = keys.map(keyLabel).join('、');
    return { name: '弱點特訓靶', icon: '🎯', color: '#f59e0b', hp: 1500, type: 'word', speed: 2.2,

  }
  function updateCrystalBar() {
    var pct = Math.max(0, G.hp / PLAYER_MAX * 100);
    var bar = $('cHpBar');
    bar.style.width = pct + '%';
    bar.classList.toggle('low', pct <= 40);
    $('cHpText').textContent = '水晶 ' + Math.max(0, G.hp) + ' / ' + PLAYER_MAX;
  }
  function renderHud() {
    var total = G.correct + G.wrong;
    var acc = total ? G.correct / total * 100 : null;
    var accEl = $('sAcc');
    accEl.textContent = acc === null ? '--' : acc.toFixed(1) + '%';
    accEl.classList.toggle('low', acc !== null && acc < 85);
    $('sDps').textContent = G.elapsed > 0.5 ? Math.round(G.totalDmg / G.elapsed) : 0;
    $('sCombo').textContent = G.combo + ' (最高 ' + G.maxCombo + ')';
    $('sDmg').textContent = Math.round(G.totalDmg);
    $('distText').textContent = Math.round(G.bossPos) + '%';
    $('distBar').style.width = G.bossPos + '%';
  }
  function renderTower() {
    var t = $('tower');
    t.innerHTML = '';
    FLOORS.forEach(function (F, i) {
      var n = i + 1;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fl';
      var locked = n > progress.unlocked;
      var cleared = progress.cleared.indexOf(n) !== -1;
      if (n === G.floor) b.classList.add('current');
      if (cleared) b.classList.add('cleared');
      b.disabled = locked;
      b.title = locked ? '尚未解鎖' : F.name;
      b.innerHTML = '<span class="ic">' + (locked ? '🔒' : F.icon) + '</span><span>' + n + '</span><small>' + (locked ? '鎖定' : (cleared ? '已擊敗' : '開放')) + '</small>';
      b.addEventListener('click', function () { loadFloor(n); });
      t.appendChild(b);
    });
    $('progText').textContent = '通關 ' + progress.cleared.length + '/' + FLOORS.length;
    $('progBar').style.width = (progress.cleared.length / FLOORS.length * 100) + '%';
  }
  function renderSaveState(ok, flash) {
    var s = $('saveState');
    s.textContent = ok ? '💾 進度已自動儲存｜最高解鎖：第 ' + progress.unlocked + ' 層 / ' + FLOORS.length : '⚠ 此瀏覽器無法儲存進度';
    if (flash) {
      s.classList.add('flash');
      setTimeout(function () { s.classList.remove('flash'); }, 1200);
    }
  }
  function setLog(msg) { $('log').textContent = msg; }

  /* ================= Boss 位置（橫向軸） ================= */
  function layoutBoss() {
    var st = $('stage'), boss = $('boss');
    var W = st.clientWidth, bw = boss.offsetWidth, homeW = $('home').offsetWidth + 8;
    var minX = 44;
    var maxX = Math.max(minX + 10, W - homeW - bw + 12);       // 到達此處＝碰到玩家陣地
    boss.style.left = (minX + (G.bossVis / 100) * (maxX - minX)) + 'px';
  }

  /* ================= 特效 ================= */
  function center(el) {
    var st = $('stage').getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - st.left, y: r.top + r.height / 2 - st.top };
  }
  function fireMissile(cls) {
    var s = center($('player')), e = center($('bossIcon'));
    var m = document.createElement('div');
    m.className = 'missile' + (cls ? ' ' + cls : '');
    m.style.left = s.x + 'px'; m.style.top = s.y + 'px';
    $('stage').appendChild(m);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { m.style.left = e.x + 'px'; m.style.top = e.y + 'px'; });
    });
    setTimeout(function () { m.remove(); }, 320);
  }
  function floatText(target, text, cls) {
    var p = center($(target));
    var d = document.createElement('div');
    d.className = 'dmg ' + (cls || '');
    d.textContent = text;
    d.style.left = (p.x + (Math.random() * 50 - 25)) + 'px';
    d.style.top = (p.y - 24 + (Math.random() * 16 - 8)) + 'px';
    $('stage').appendChild(d);
    setTimeout(function () { d.remove(); }, 950);
  }
  function ringAt(target) {
    var p = center($(target));
    var r = document.createElement('div');
    r.className = 'ring';
    r.style.left = p.x + 'px'; r.style.top = p.y + 'px';
    $('stage').appendChild(r);
    setTimeout(function () { r.remove(); }, 520);
  }
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function shake(big) {
    var a = $('app');
    a.classList.remove('shake', 'shake-big'); void a.offsetWidth;
    a.classList.add(big ? 'shake-big' : 'shake');
  }

  /* ================= 戰鬥邏輯 ================= */
  function onCorrect(k) {
    G.correct++; G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.err = false;
    G.pos++;
    flashKey(k, 'ok');

    var len = G.text.length;
    var unitDone = G.pos >= len;
    var mult = 1 + Math.min(G.combo, 50) * 0.04;               // 連擊加成，最高 ×3
    var dmg = Math.round((BASE_DMG + (unitDone ? len * WORD_BONUS : 0)) * mult);

    // 擊退：每字微幅；完成單字再大幅擊退（單字越長退越遠）
    var kb = KB_SMALL;
    var bigKb = 0;
    if (unitDone) bigKb = len > 1 ? Math.min(4 + len * 0.9, 24) : 1.0;
    kb += bigKb;
    G.bossPos = Math.max(0, G.bossPos - kb);

    var before = G.bossHp;
    G.bossHp -= dmg;
    G.totalDmg += Math.min(dmg, before);
    var dead = G.bossHp <= 0;

    fireMissile(unitDone ? 'big' : '');
    playSfx(unitDone && len > 1 ? 'critical' : 'hit');
    if (!G.training && unitDone && len > 1) addCrit();                      // 成就：單字爆擊累計
    if (!G.training && G.combo >= COMBO_GOAL) unlockAch('speed');           // 成就：連續 30 字未失誤
    setTimeout(function () {
      retrigger($('boss'), 'hit');
      floatText('bossIcon', (unitDone ? '爆擊 -' : '-') + dmg, unitDone ? 'crit' : '');
      if (bigKb >= 4) { ringAt('bossIcon'); floatText('bossIcon', '◀ 擊退！', 'kb'); }
      updateBossBar();
    }, 210);

    if (unitDone) setLog('💥 完整擊破「' + G.text + '」！爆擊 ' + dmg + '，Boss 被大幅擊退！（×' + mult.toFixed(2) + '）');
    else setLog('命中！連擊 ' + G.combo + '（傷害 ×' + mult.toFixed(2) + '）');

    if (dead) { G.state = 'over'; updateTarget(); renderHud(); win(); return; }

    if (unitDone) {
      retrigger($('target'), 'flash');
      G.text = nextUnit(); G.pos = 0;
      renderUnit();
    } else {
      updateTarget();
    }
  }

  function onWrong(k) {
    G.wrong++; G.combo = 0; G.err = true;
    flashKey(k, 'bad');
    updateTarget();
    shake(false);
    setLog('✖ 打錯了！Boss 繼續前進…');
  }

  function contactTick() {
    G.hp = Math.max(0, G.hp - CONTACT_DMG);
    playSfx('warning');
    updateCrystalBar();
    shake(true);
    retrigger($('player'), 'hurt');
    floatText('crystal', '-' + CONTACT_DMG, 'pl');
    setLog('🔥 Boss 正在攻擊水晶！快把它擊退！');
    if (G.hp <= 0) lose();
  }

  document.addEventListener('keydown', function (e) {
    var caps = e.getModifierState && e.getModifierState('CapsLock');
    if (caps && G.state === 'playing') $('shiftHint').textContent = '⚠ Caps Lock 已開啟，請先關閉！';

    if (achOpen || weakOpen) { if (e.key === 'Escape') { if (achOpen) closeAch(); else closeWeak(); } return; }

    if (G.state === 'ready' && !modalOpen) {
      if (e.key === 'Enter') { e.preventDefault(); startBattle(); }
      return;
    }
    if (G.state !== 'playing') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Backspace') { e.preventDefault(); return; }
    if (e.key.length !== 1) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (e.repeat) return;                                       // 防止長按連續觸發
    var tgt = G.text.charAt(G.pos), hit = e.key === tgt;
    if (!caps) recordKey(tgt, hit);                          // Caps Lock 開啟時字母必錯，不計入統計
    if (hit) onCorrect(e.key); else onWrong(e.key);
    renderHud();
  });
  window.addEventListener('resize', layoutBoss);

  /* ================= 主迴圈 ================= */
  var lastTs = performance.now();
  function loop(ts) {
    var dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;
    var F = curFloor();

    if (G.state === 'playing' && !achOpen && !weakOpen) {
      G.elapsed += dt;
      G.bossPos = Math.min(100, G.bossPos + F.speed * dt);      // Boss 由左向右推進
      var contact = G.bossPos >= 100;
      if (contact) {
        G.contactTimer += dt;
        if (G.contactTimer >= 1) { G.contactTimer -= 1; contactTick(); }
      } else {
        G.contactTimer = 0;
      }
      if (G.state === 'playing') {
        $('warn').classList.toggle('on', contact);
        $('warnText').classList.toggle('on', contact);
        $('crystal').classList.toggle('danger', contact);
      }
    }
    G.bossVis += (G.bossPos - G.bossVis) * Math.min(1, dt * 10); // 擊退平滑動畫
    layoutBoss();
    renderHud();
    requestAnimationFrame(loop);
  }

  /* ================= 勝敗 ================= */
  function endWarn() {
    $('warn').classList.remove('on');
    $('warnText').classList.remove('on');
    $('crystal').classList.remove('danger');
  }
  function win() {
    var F = curFloor();
    endWarn();
    if (!G.training) {                                       // 特訓不影響進度與成就
      checkWinAchievements();
      if (progress.cleared.indexOf(G.floor) === -1) progress.cleared.push(G.floor);
      if (G.floor < FLOORS.length && progress.unlocked < G.floor + 1) progress.unlocked = G.floor + 1;
    }
    setLog('🏆 擊敗了 ' + F.name + '！');
    setTimeout(function () { $('boss').classList.add('dead'); }, 230);
    setTimeout(function () {
      if (!G.training) saveProgress();
      renderTower();
      showModal(true);
    }, 1200);
  }
  function lose() {
    G.state = 'over';
    var F = curFloor();
    endWarn();
    $('player').classList.add('dead');
    $('crystal').classList.add('dead');
    setLog('💀 水晶被 ' + F.name + ' 摧毀了…');
    updateKeyboard();
    setTimeout(function () { showModal(false); }, 800);
  }

  /* ================= 彈窗 ================= */
  var modalOpen = false;
  function showModal(victory) {
    var F = curFloor();
    var tr = G.training;
    var last = !tr && G.floor >= FLOORS.length;
    var total = G.correct + G.wrong;
    var acc = total ? (G.correct / total * 100).toFixed(1) + '%' : '--';
    var dps = G.elapsed > 0.5 ? Math.round(G.totalDmg / G.elapsed) : 0;
    var m = Math.floor(G.elapsed / 60), s = Math.floor(G.elapsed % 60);
    var time = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    var box = $('modalBox');
    box.className = 'box' + (victory ? '' : ' fail');
    var title = tr ? (victory ? '🎯 特訓完成！' : '💀 特訓失敗')
      : (victory ? (last ? '👑 登頂成功！' : '💥 擊殺通關！') : '💀 挑戰失敗');
    var msg = tr
      ? (victory ? '弱點特訓完成！多練幾次，錯誤率就會慢慢下降。' : '水晶被摧毀了，放慢一點，先求準再求快吧！')
      : (victory
          ? (last ? '你擊敗了高塔終極魔王，征服了整座高塔！' : '擊敗了 ' + F.name + '，已解鎖第 ' + (G.floor + 1) + ' 層！')
          : '水晶被摧毀了，穩住節奏、少打錯字再挑戰一次吧！');
    box.innerHTML =
      '<h2>' + title + '</h2><p>' + msg + '</p>' +
      '<div class="res">' +
        '<div><b>' + time + '</b><span>戰鬥時間</span></div>' +
        '<div><b>' + dps + '</b><span>DPS</span></div>' +
        '<div><b>' + acc + '</b><span>正確率</span></div>' +
        '<div><b>' + G.maxCombo + '</b><span>最高連擊</span></div>' +
        worstHtml() +
      '</div>' +
      '<div class="btns">' + resultButtons(victory, last, tr) + '</div>';
    $('modal').hidden = false;
    modalOpen = true;
    var nx = $('mNext');
    if (nx) nx.addEventListener('click', function () { loadFloor(G.floor + 1); });
    $('mRetry').addEventListener('click', function () { if (tr) loadFloor(0, true); else loadFloor(G.floor); });
    var bk = $('mBack');
    if (bk) bk.addEventListener('click', function () { loadFloor(progress.unlocked); });
    $('mWeak').addEventListener('click', openWeak);
    $('mClose').addEventListener('click', closeModal);
  }
  function closeModal() {
    $('modal').hidden = true;
    modalOpen = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  /* ================= 重置 ================= */
  $('resetBtn').addEventListener('click', function () {
    if (confirm('確定要重置所有遊戲進度、成就徽章與錯字統計嗎？此動作無法復原。')) {
      progress = { unlocked: 1, cleared: [] };
      saveProgress();
      resetAch();
      resetWeak();
      loadFloor(1);
    }
  });

  /* ================= 啟動 ================= */
  buildKeyboard();
  loadFloor(progress.unlocked);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
